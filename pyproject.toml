[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgermind-ai"
version = "0.1.0"
description = "AI-Powered Financial Analytics, Fraud Detection, and Intelligent Reporting Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Sona J" },
]

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # --- Data Validation & Settings ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # --- Data Science ---
    "pandas>=2.2.0",
    "numpy>=2.1.0",

    # --- Visualization ---
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",

    # --- Machine Learning ---
    "scikit-learn>=1.5.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.55.0",
    # "langchain>=0.3.0",
    # "chromadb>=0.5.0",
]
torch = [
    "torch>=2.5.0",
]
dashboard = [
    "streamlit>=1.40.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
mlops = [
    "mlflow>=2.18.0",
    "joblib>=1.4.0",
]
notebook = [
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]
all = [
    "ledgermind-ai[ai,dashboard,dev,mlops,notebook]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (need database)",
    "api: API endpoint tests",
    "ml: Machine learning pipeline tests",
    "slow: Tests that take a long time",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "N803", # argument name should be lowercase (e.g. X_train)
    "N806", # variable in function should be lowercase (e.g. X_val)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends/Header idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app", "ml"]
omit = ["tests/*", "migrations/*", "app/dashboard.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80


[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*",
]
ignore_missing_imports = true