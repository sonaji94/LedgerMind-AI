name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MYPYPATH: .
      APP_ENV: testing
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-at-least-32-chars-long
      CORS_ORIGINS: http://localhost:8501
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      DATABASE_URL_SYNC: sqlite:///./test_ci.db
      RAZORPAY_WEBHOOK_SECRET: rzp_whsec_test_secret_key_12345
      DISABLE_SQLALCHEMY_CEXT: "1"
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard,mlops]"

      - name: Train and Export Production ONNX Hybrid Models
        run: |
          python ml/train.py
          python ml/export_onnx.py

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy --install-types --non-interactive --explicit-package-bases app ml scripts tests

      - name: Run Pytest Test Suite
        run: pytest -v --cov=app --cov=ml --cov-report=term-missing
