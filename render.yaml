# ============================================================
# LedgerMind AI — Render Cloud Deployment Blueprint (render.yaml)
# ============================================================
# Infrastructure-as-Code specification defining:
#   1. ledgermind-api: FastAPI + ONNX Runtime backend
#   2. ledgermind-ui: Streamlit operations cockpit
#   3. ledgermind-postgres: Managed PostgreSQL 16 database
#   4. ledgermind-redis: Managed Redis 7 velocity cache
# ============================================================

version: "1"

services:
  # ── 1. FastAPI REST & ONNX Inference Engine ───────────────
  - type: web
    name: ledgermind-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: ledgermind-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ledgermind-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://ledgermind-ui.onrender.com,http://localhost:8501,http://localhost:3000"

  # ── 2. Streamlit Operations Dashboard ─────────────────────
  - type: web
    name: ledgermind-ui
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /_stcore/health
    numInstances: 1
    envVars:
      - key: PORT
        value: 8501
      - key: BACKEND_API_URL
        value: "http://ledgermind-api:8000/api/v1"

  # ── 3. Redis In-Memory Velocity Engine ────────────────────
  - type: redis
    name: ledgermind-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  # ── 4. Authoritative PostgreSQL Database ──────────────────
  - name: ledgermind-postgres
    databaseName: ledgermind_db
    user: ledgermind
    plan: standard
    region: oregon
    postgresMajorVersion: 16
