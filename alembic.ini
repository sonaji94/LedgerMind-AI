# Alembic Configuration File
# ==========================
# Used by Alembic to run database migrations.

[alembic]
script_location = migrations
prepend_sys_path = .

# Connection string is overridden at runtime by migrations/env.py
# using app.core.config.Settings.database_url_sync
sqlalchemy.url = postgresql://ledgermind:changeme@localhost:5432/ledgermind_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
